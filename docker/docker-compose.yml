version: '3.8'

services:
  priority-scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: priority-scheduler
    ports:
      - "8046:8046"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/scheduler
      - REDIS_URL=redis://redis:6379/8
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - WORKER_COUNT=${WORKER_COUNT:-4}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - DEFAULT_QUEUE=${DEFAULT_QUEUE:-default}
      - CRITICAL_QUEUE=${CRITICAL_QUEUE:-critical}
      - TASK_TIMEOUT_SECONDS=${TASK_TIMEOUT_SECONDS:-300}
      - DEBUG=${DEBUG:-false}
      - GLOBAL_STATE_MANAGER_URL=http://global-state-manager:8035
    # No depends_on here - postgres/redis/rabbitmq moved to shared infra
    # (deploy/docker-compose.infra.yml), a different compose project.
    # Bring that up first: deploy/03-build-and-up.sh infra-up
    networks:
      - os42-shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8046/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  os42-shared:
    external: true
